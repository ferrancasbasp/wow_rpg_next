name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/player
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/player/package-lock.json
      - run: npm ci
      - name: Unit tests (diagnóstico CI)
        run: |
          set +e
          npx ng test --watch=false > /tmp/ngtest.log 2>&1
          code=$?
          echo "ng test exit code: $code"
          tail -40 /tmp/ngtest.log
          exit $code
      - name: Subir log de tests si fallan
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ngtest-log
          path: /tmp/ngtest.log
      - run: npx ng build --configuration production
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/player/dist/player/browser
          force_orphan: true

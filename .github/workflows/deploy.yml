name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/player
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/player/package-lock.json
      - run: npm ci
      - name: Unit tests (diagnóstico CI)
        run: |
          set +e
          npx ng test --watch=false > /tmp/ngtest.log 2>&1
          code=$?
          echo "ng test exit code: $code"
          if [ $code -ne 0 ]; then
            while IFS= read -r line; do
              echo "::error file=ngtest.log::$line"
            done < <(tail -40 /tmp/ngtest.log)
          fi
          tail -40 /tmp/ngtest.log
          exit $code
      - run: npx ng build --configuration production
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/player/dist/player/browser
          force_orphan: true
